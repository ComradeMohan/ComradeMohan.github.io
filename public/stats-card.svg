<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="220">
  <defs>
    <clipPath id="cmd-clip">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" values="0; 0; 240; 240" keyTimes="0; 0.15; 0.7; 1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    :root {
      --bg-card: #F6F8FA;
      --border-1: #D0D7DE;
      --border-2: #E1E5EA;
      --grid: #D0D7DE;

      --accent: #0F766E;
      --accent-soft: #CCFBF1;
      --pill: #E6F4F1;

      --title: #24292F;
      --text: #57606A;

      --chip: #FFFFFF;
      --term-header: #E1E5EA;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-card: #0f172a;
        --border-1: #1e293b;
        --border-2: #334155;
        --grid: #1e293b;

        --accent: #2dd4bf;
        --accent-soft: rgba(45, 212, 191, 0.14);
        --pill: rgba(45, 212, 191, 0.08);

        --title: #e2e8f0;
        --text: #94a3b8;

        --chip: #0b1220;
        --term-header: #161b22;
      }
    }

    .terminal-font {
      font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;
    }
  </style>

  <!-- Container Box -->
  <g>
    <rect x="2" y="2" width="396" height="216" rx="12" ry="12" fill="var(--bg-card)" stroke="var(--border-1)" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect x="2" y="2" width="396" height="34" rx="12" ry="12" fill="var(--term-header)"/>
    <path d="M 2 24 L 398 24 L 398 36 L 2 36 Z" fill="var(--term-header)"/>
    <line x1="2" y1="36" x2="398" y2="36" stroke="var(--border-2)" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="18" r="5" fill="#27c93f"/>

    <text x="200" y="22" fill="var(--text)" class="terminal-font" font-size="11" text-anchor="middle">
      developer@comrademohan:~
    </text>

    <!-- Terminal Command Line -->
    <g transform="translate(20, 64)">
      <text x="0" y="0" fill="var(--accent)" class="terminal-font" font-size="13" font-weight="bold">➜</text>
      <text x="16" y="0" fill="var(--title)" class="terminal-font" font-size="13">whoami</text>
      
      <!-- Command Output -->
      <text x="0" y="24" fill="var(--title)" class="terminal-font" font-size="14" font-weight="bold">
        Mohan Reddy
      </text>
      <text x="0" y="44" fill="var(--text)" class="terminal-font" font-size="12">
        Full Stack Developer &amp; Systems Eng
      </text>
    </g>

    <!-- Stack Badges -->
    <g transform="translate(20, 136)">
      <rect x="0" y="0" width="80" height="22" rx="4" fill="var(--chip)" stroke="var(--border-2)" stroke-width="1"/>
      <text x="40" y="15" fill="var(--accent)" class="terminal-font" font-size="11" text-anchor="middle">React 18</text>

      <rect x="90" y="0" width="105" height="22" rx="4" fill="var(--chip)" stroke="var(--border-2)" stroke-width="1"/>
      <text x="142" y="15" fill="var(--accent)" class="terminal-font" font-size="11" text-anchor="middle">TypeScript</text>

      <rect x="205" y="0" width="100" height="22" rx="4" fill="var(--chip)" stroke="var(--border-2)" stroke-width="1"/>
      <text x="255" y="15" fill="var(--accent)" class="terminal-font" font-size="11" text-anchor="middle">Java SE 17</text>
    </g>

    <!-- Interactive Status / Cursor Prompt -->
    <g transform="translate(20, 192)">
      <text x="0" y="0" fill="var(--accent)" class="terminal-font" font-size="12" font-weight="bold">status:</text>
      <g transform="translate(56, -12)">
        <g clip-path="url(#cmd-clip)">
          <text x="0" y="12" fill="var(--title)" class="terminal-font" font-size="12">
            ready_to_build();
          </text>
        </g>
        <!-- Blinking Cursor -->
        <rect x="0" y="1" width="7" height="13" fill="var(--accent)">
          <animate attributeName="x" values="0; 0; 155; 155" keyTimes="0; 0.15; 0.7; 1" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1; 0; 1; 0; 1" dur="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
