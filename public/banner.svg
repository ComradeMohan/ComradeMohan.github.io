<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Fonts styling -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');

      /* ============ MOHANREDDY.ME THEME TOKENS (Auto Light/Dark) ============ */
      :root {
        --bg-card: #FFFFFF;
        --border-1: #E2E8F0;
        --border-2: #EDF2F7;
        --grid: #E2E8F0;
        --grid-line: #E2E8F0;

        --accent: #EA431B;
        --accent-purple: #9333EA;
        --accent-soft: rgba(234, 67, 27, 0.12);
        --accent-soft-bg: rgba(234, 67, 27, 0.10);
        --pill: #FFF5F2;
        --pill-bg: #FFF5F2;

        --title: #111827;
        --text: #4B5563;
        --text-secondary: #4B5563;

        --chip: #F8FAFC;
        --chip-bg: #F8FAFC;
        --chip-border: #E2E8F0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-card: #131828;
          --border-1: #20263c;
          --border-2: #2a324b;
          --grid: #1c2235;
          --grid-line: #1c2235;

          --accent: #F97316;
          --accent-purple: #C054DC;
          --accent-soft: rgba(249, 115, 22, 0.16);
          --accent-soft-bg: rgba(249, 115, 22, 0.14);
          --pill: rgba(249, 115, 22, 0.10);
          --pill-bg: rgba(249, 115, 22, 0.10);

          --title: #F1F5F9;
          --text: #94A3B8;
          --text-secondary: #94A3B8;

          --chip: #0D111C;
          --chip-bg: #0D111C;
          --chip-border: #20263c;
        }
      }

      /* Text Styling */
      text {
        font-family: 'Space Grotesk', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .title {
        font-weight: 800;
        font-size: 22px;
        fill: var(--title);
        letter-spacing: -0.02em;
      }
      .repo-name {
        font-weight: 600;
        font-size: 12px;
        fill: var(--accent);
        letter-spacing: -0.01em;
      }
      .subtitle {
        font-weight: 600;
        font-size: 13.5px;
        fill: var(--text);
        letter-spacing: -0.01em;
      }
      .description {
        font-weight: 400;
        font-size: 12.5px;
        fill: var(--text);
        line-height: 1.45;
      }
      .chip-text {
        font-weight: 600;
        font-size: 11.5px;
        fill: var(--title);
      }
      .badge-text {
        font-weight: 700;
        font-size: 10px;
        fill: var(--accent);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .data-text {
        font-weight: 600;
        font-size: 11.5px;
        fill: var(--accent);
        letter-spacing: -0.01em;
      }

      /* Theme-linked element utility classes */
      .card-bg { fill: var(--bg-card); }
      .card-border { stroke: var(--border-1); }
      .grid-line { stroke: var(--grid-line); }
      .chip-bg { fill: var(--chip-bg); stroke: var(--chip-border); }
      .pill-bg { fill: var(--pill-bg); stroke: var(--accent); }
      .accent-soft-bg { fill: var(--accent-soft-bg); stroke: var(--accent); }
      .accent-stroke { stroke: var(--accent); }
      .accent-fill { fill: var(--accent); }
      .purple-stroke { stroke: var(--accent-purple); }
      .purple-fill { fill: var(--accent-purple); }
      .divider-line { stroke: var(--border-1); }

      /* Gradient Stop CSS Variable Classes */
      .stop-border-1 { stop-color: var(--border-1); }
      .stop-border-2 { stop-color: var(--border-2); }
      .stop-accent { stop-color: var(--accent); }

      /* CSS animations as progressive enhancement */
      .glow-pulse {
        animation: pulseGlow 4s ease-in-out infinite alternate;
        transform-origin: 780px 6px;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.92); }
        100% { opacity: 0.9; transform: scale(1.08); }
      }
      .float-icon {
        animation: floatMotion 3.5s ease-in-out infinite;
      }
      @keyframes floatMotion {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .shimmer-bar {
        animation: shimmerMove 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes shimmerMove {
        0% { transform: translateX(-400px); }
        35%, 100% { transform: translateX(800px); }
      }
      .dot-pulse {
        animation: dotBlink 2s ease-in-out infinite alternate;
      }
      @keyframes dotBlink {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
      .accent-line-pulse {
        animation: lineGlow 3s ease-in-out infinite alternate;
      }
      @keyframes lineGlow {
        0% { opacity: 0.7; stroke-width: 3; }
        100% { opacity: 1; stroke-width: 4.5; }
      }
    </style>

    <!-- Filter for soft shadow -->
    <filter id="banner-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients with both CSS classes and safe fallback values -->
    <linearGradient id="banner-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="stop-border-1" style="stop-color: var(--border-1);" stop-color="#E2E8F0"/>
      <stop offset="50%" class="stop-border-2" style="stop-color: var(--border-2);" stop-color="#EDF2F7"/>
      <stop offset="100%" class="stop-border-1" style="stop-color: var(--border-1);" stop-color="#E2E8F0"/>
    </linearGradient>

    <radialGradient id="banner-glow" cx="100%" cy="0%" r="90%">
      <stop offset="0%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0.22"/>
      <stop offset="100%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="banner-shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0"/>
      <stop offset="50%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0.10"/>
      <stop offset="100%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0"/>
    </linearGradient>

    <!-- Blueprint tiny grid pattern -->
    <pattern id="banner-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" style="stroke: var(--grid-line);" stroke="#E2E8F0" stroke-width="1" opacity="0.3"/>
    </pattern>

    <!-- Clip for rounded card contents -->
    <clipPath id="banner-clip">
      <rect x="8" y="6" width="784" height="208" rx="14"/>
    </clipPath>
  </defs>

  <!-- Card Body with Shadow -->
  <g filter="url(#banner-shadow)">
    <!-- Base Card Frame -->
    <rect x="8" y="6" width="784" height="208" rx="14" class="card-bg" style="fill: var(--bg-card);" fill="#FFFFFF" stroke="url(#banner-border-grad)" stroke-width="1.5"/>

    <!-- Inside Card Contents (Clipped) -->
    <g clip-path="url(#banner-clip)">
      <rect x="8" y="6" width="784" height="208" fill="url(#banner-grid)"/>

      <!-- Ambient Radial Glow with SMIL + CSS pulse -->
      <circle class="glow-pulse" cx="780" cy="6" r="240" fill="url(#banner-glow)">
        <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="220; 260; 220" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- Moving Shimmer Beam with SMIL + CSS -->
      <rect class="shimmer-bar" x="-350" y="6" width="300" height="208" fill="url(#banner-shimmer-grad)">
        <animate attributeName="x" values="-350; 800; -350" keyTimes="0; 0.45; 1" dur="6s" repeatCount="indefinite"/>
      </rect>

      <!-- Top Accent Line with SMIL Pulse -->
      <line class="accent-line-pulse accent-stroke" x1="8" y1="6" x2="792" y2="6" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="3.5">
        <animate attributeName="stroke-width" values="3; 4.5; 3" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Corner Accent Bracket with SMIL Pulse -->
    <path class="accent-stroke" d="M 20 24 L 20 16 L 28 16" fill="none" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="stroke-width" values="1.8; 2.8; 1.8" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Header Row: Developer Avatar / Terminal Icon + Title -->
    <g transform="translate(26, 22)">
      <!-- Modern Terminal / Developer Icon with SMIL float motion -->
      <g class="float-icon">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0" dur="3.5s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="36" height="36" rx="8" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
        <circle cx="7" cy="7" r="2" fill="#EF4444"/>
        <circle cx="13" cy="7" r="2" fill="#F59E0B"/>
        <circle cx="19" cy="7" r="2" fill="#10B981"/>
        <path class="accent-stroke" d="M 9 17 L 15 22 L 9 27" fill="none" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line class="purple-stroke" x1="18" y1="27" x2="27" y2="27" style="stroke: var(--accent-purple);" stroke="#9333EA" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="48" y="19" class="title">Hi, I'm Mohan Reddy 👋</text>
      <text x="48" y="33" class="repo-name">Full-Stack Developer • Software Engineer • Cyber Expert</text>
    </g>

    <!-- Category Pill (Top-Right) -->
    <g transform="translate(576, 22)">
      <rect x="0" y="0" width="200" height="24" rx="12" class="pill-bg" style="fill: var(--pill-bg); stroke: var(--accent);" fill="#FFF5F2" stroke="#EA431B" stroke-width="1"/>
      <circle cx="13" cy="12" r="4" fill="#10B981">
        <animate attributeName="r" values="3.2; 5; 3.2" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="15.5" class="badge-text">AVAILABLE FOR OPPORTUNITIES</text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="26" y="86" class="subtitle">Crafting resilient distributed systems, high-performance web applications, and intuitive cyber-aesthetic UIs.</text>

    <!-- Description Details -->
    <text x="26" y="107" class="description">Experienced in modern React/Next.js frontend architectures, JVM concurrency, and scalable cloud services.</text>

    <!-- Accent Divider Line -->
    <line class="divider-line" x1="26" y1="124" x2="774" y2="124" style="stroke: var(--border-1);" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Bottom Row: Tech Chips (Left) -->
    <g transform="translate(26, 137)">
      <!-- Chip 1: React 18 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="94" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">⚡ React 18</text>
      </g>

      <!-- Chip 2: TypeScript -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="102" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">📘 TypeScript</text>
      </g>

      <!-- Chip 3: Java SE 17 -->
      <g transform="translate(208, 0)">
        <rect x="0" y="0" width="105" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.1s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">☕ Java SE 17</text>
      </g>

      <!-- Chip 4: Python/ML -->
      <g transform="translate(319, 0)">
        <rect x="0" y="0" width="98" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">🐍 Python/ML</text>
      </g>

      <!-- Chip 5: Oracle Certified -->
      <g transform="translate(423, 0)">
        <rect x="0" y="0" width="134" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse purple-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent-purple);" fill="#9333EA">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">🏆 Oracle Certified</text>
      </g>
    </g>

    <!-- Bottom Row: GitHub Data Pill (Right) -->
    <g transform="translate(566, 137)">
      <rect x="0" y="0" width="210" height="24" rx="12" class="accent-soft-bg" style="fill: var(--accent-soft-bg); stroke: var(--accent);" fill="#FFF5F2" stroke="#EA431B" stroke-width="1"/>
      <g transform="translate(10, 5)">
        <path class="accent-fill" d="M5 1a4 4 0 0 0-1.3 7.8c.2.1.3 0 .3-.2v-.7c-1.1.2-1.3-.6-1.3-.6-.2-.4-.4-.6-.4-.6-.3-.2 0-.2 0-.2.4 0 .6.3.6.3.4.6 1 .4 1.2.3 0-.3.2-.4.3-.6-.9-.1-1.8-.4-1.8-2 0-.4.1-.8.4-1.1a1.5 1.5 0 0 1 .1-1.1s.3-.1 1.1.3a3.8 3.8 0 0 1 2 0c.8-.4 1.1-.3 1.1-.3a1.5 1.5 0 0 1 .1 1.1c.3.3.4.7.4 1.1 0 1.6-.9 1.9-1.8 2 .2.2.3.4.3.8v1.2c0 .2.1.3.3.2A4 4 0 0 0 5 1z" style="fill: var(--accent);" fill="#EA431B"/>
      </g>
      <text x="26" y="16" class="data-text">GitHub • ComradeMohan</text>
    </g>

    <!-- Lower Status Bar -->
    <g transform="translate(26, 173)">
      <rect x="0" y="0" width="750" height="24" rx="12" class="pill-bg" style="fill: var(--pill-bg); stroke: var(--accent);" fill="#FFF5F2" stroke="#EA431B" stroke-width="1"/>
      <g transform="translate(12, 6)">
        <circle cx="6" cy="6" r="5" fill="none" class="accent-stroke" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="1.2"/>
        <circle cx="6" cy="6" r="2" class="accent-fill" style="fill: var(--accent);" fill="#EA431B"/>
      </g>
      <text x="32" y="16" class="data-text">🌐 mohanreddy.me • Open to Full-Stack &amp; Software Engineering Roles</text>
    </g>
  </g>
</svg>
