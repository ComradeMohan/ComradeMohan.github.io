<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 310" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');

      /* ============ MOHANREDDY.ME THEME TOKENS (Auto Light/Dark) ============ */
      :root {
        --bg-card: #FFFFFF;
        --border-1: #E2E8F0;
        --border-2: #EDF2F7;
        --grid: #E2E8F0;
        --grid-line: #E2E8F0;

        --accent: #EA431B;
        --accent-purple: #9333EA;
        --accent-soft: rgba(234, 67, 27, 0.12);
        --accent-soft-bg: rgba(234, 67, 27, 0.10);
        --pill: #FFF5F2;
        --pill-bg: #FFF5F2;

        --title: #111827;
        --text: #4B5563;
        --chip: #F8FAFC;
        --chip-bg: #F8FAFC;
        --chip-border: #E2E8F0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-card: #131828;
          --border-1: #20263c;
          --border-2: #2a324b;
          --grid: #1c2235;
          --grid-line: #1c2235;

          --accent: #F97316;
          --accent-purple: #C054DC;
          --accent-soft: rgba(249, 115, 22, 0.16);
          --accent-soft-bg: rgba(249, 115, 22, 0.14);
          --pill: rgba(249, 115, 22, 0.10);
          --pill-bg: rgba(249, 115, 22, 0.10);

          --title: #F1F5F9;
          --text: #94A3B8;
          --chip: #0D111C;
          --chip-bg: #0D111C;
          --chip-border: #20263c;
        }
      }

      text {
        font-family: 'Space Grotesk', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .title {
        font-weight: 800;
        font-size: 20px;
        fill: var(--title);
        letter-spacing: -0.02em;
      }
      .repo-name {
        font-weight: 600;
        font-size: 11.5px;
        fill: var(--accent);
        letter-spacing: -0.01em;
      }
      .subtitle {
        font-weight: 600;
        font-size: 13.5px;
        fill: var(--text);
        letter-spacing: -0.01em;
      }
      .description {
        font-weight: 400;
        font-size: 12px;
        fill: var(--text);
        line-height: 1.45;
      }
      .chip-text {
        font-weight: 600;
        font-size: 11px;
        fill: var(--title);
      }
      .badge-text {
        font-weight: 700;
        font-size: 9.5px;
        fill: var(--accent);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .data-text {
        font-weight: 600;
        font-size: 11px;
        fill: var(--accent);
        letter-spacing: -0.01em;
      }

      /* Theme-linked element utility classes */
      .card-bg { fill: var(--bg-card); }
      .card-border { stroke: var(--border-1); }
      .grid-line { stroke: var(--grid-line); }
      .chip-bg { fill: var(--chip-bg); stroke: var(--chip-border); }
      .pill-bg { fill: var(--pill-bg); stroke: var(--accent); }
      .accent-soft-bg { fill: var(--accent-soft-bg); stroke: var(--accent); }
      .accent-stroke { stroke: var(--accent); }
      .accent-fill { fill: var(--accent); }
      .purple-stroke { stroke: var(--accent-purple); }
      .purple-fill { fill: var(--accent-purple); }
      .divider-line { stroke: var(--border-1); }

      /* Gradient Stop CSS Variable Classes */
      .stop-border-1 { stop-color: var(--border-1); }
      .stop-border-2 { stop-color: var(--border-2); }
      .stop-accent { stop-color: var(--accent); }

      /* Animations */
      .glow-pulse {
        animation: pulseGlow 4s ease-in-out infinite alternate;
        transform-origin: 432px 6px;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.92); }
        100% { opacity: 0.9; transform: scale(1.08); }
      }
      .float-icon {
        animation: floatMotion 3.5s ease-in-out infinite;
      }
      @keyframes floatMotion {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .shimmer-bar {
        animation: shimmerMove 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes shimmerMove {
        0% { transform: translateX(-300px); }
        35%, 100% { transform: translateX(500px); }
      }
      .dot-pulse {
        animation: dotBlink 2s ease-in-out infinite alternate;
      }
      @keyframes dotBlink {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
      .accent-line-pulse {
        animation: lineGlow 3s ease-in-out infinite alternate;
      }
      @keyframes lineGlow {
        0% { opacity: 0.7; stroke-width: 3; }
        100% { opacity: 1; stroke-width: 4.5; }
      }
    </style>

    <filter id="m-banner-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="m-banner-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="stop-border-1" style="stop-color: var(--border-1);" stop-color="#E2E8F0"/>
      <stop offset="50%" class="stop-border-2" style="stop-color: var(--border-2);" stop-color="#EDF2F7"/>
      <stop offset="100%" class="stop-border-1" style="stop-color: var(--border-1);" stop-color="#E2E8F0"/>
    </linearGradient>

    <radialGradient id="m-banner-glow" cx="100%" cy="0%" r="90%">
      <stop offset="0%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0.22"/>
      <stop offset="100%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="m-banner-shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0"/>
      <stop offset="50%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0.10"/>
      <stop offset="100%" class="stop-accent" style="stop-color: var(--accent);" stop-color="#EA431B" stop-opacity="0"/>
    </linearGradient>

    <pattern id="m-banner-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" style="stroke: var(--grid-line);" stroke="#E2E8F0" stroke-width="1" opacity="0.3"/>
    </pattern>

    <clipPath id="m-banner-clip">
      <rect x="8" y="6" width="424" height="298" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#m-banner-shadow)">
    <!-- Base Card Frame -->
    <rect x="8" y="6" width="424" height="298" rx="14" class="card-bg" style="fill: var(--bg-card);" fill="#FFFFFF" stroke="url(#m-banner-border-grad)" stroke-width="1.5"/>

    <!-- Inside Card Contents -->
    <g clip-path="url(#m-banner-clip)">
      <rect x="8" y="6" width="424" height="298" fill="url(#m-banner-grid)"/>

      <!-- Ambient Glow with SMIL + CSS -->
      <circle class="glow-pulse" cx="420" cy="6" r="180" fill="url(#m-banner-glow)">
        <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="160; 200; 160" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- Moving Shimmer Beam with SMIL + CSS -->
      <rect class="shimmer-bar" x="-250" y="6" width="200" height="298" fill="url(#m-banner-shimmer-grad)">
        <animate attributeName="x" values="-250; 450; -250" keyTimes="0; 0.45; 1" dur="6s" repeatCount="indefinite"/>
      </rect>

      <!-- Top Accent Line with SMIL Pulse -->
      <line class="accent-line-pulse accent-stroke" x1="8" y1="6" x2="432" y2="6" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="3.5">
        <animate attributeName="stroke-width" values="3; 4.5; 3" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Corner Accent Bracket -->
    <path class="accent-stroke" d="M 20 24 L 20 16 L 28 16" fill="none" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="stroke-width" values="1.8; 2.8; 1.8" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Header Row: Developer Avatar / Terminal Icon + Title -->
    <g transform="translate(22, 22)">
      <g class="float-icon">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.5s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="34" height="34" rx="8" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
        <circle cx="6" cy="6" r="2" fill="#EF4444"/>
        <circle cx="12" cy="6" r="2" fill="#F59E0B"/>
        <circle cx="18" cy="6" r="2" fill="#10B981"/>
        <path class="accent-stroke" d="M 8 16 L 14 21 L 8 26" fill="none" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line class="purple-stroke" x1="17" y1="26" x2="25" y2="26" style="stroke: var(--accent-purple);" stroke="#9333EA" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="44" y="18" class="title">Hi, I'm Mohan Reddy 👋</text>
      <text x="44" y="32" class="repo-name">Full-Stack Developer • Cyber Expert</text>
    </g>

    <!-- Category Pill (Below Title on Mobile) -->
    <g transform="translate(22, 66)">
      <rect x="0" y="0" width="190" height="22" rx="11" class="pill-bg" style="fill: var(--pill-bg); stroke: var(--accent);" fill="#FFF5F2" stroke="#EA431B" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#10B981">
        <animate attributeName="r" values="3; 4.5; 3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="14.5" class="badge-text">AVAILABLE FOR ROLES</text>
    </g>

    <!-- Subtitle & Description -->
    <text x="22" y="108" class="subtitle">Crafting resilient distributed systems &amp; modern UIs.</text>
    <text x="22" y="128" class="description">Experienced in React, Next.js, Java SE 17, and cloud architectures.</text>

    <!-- Accent Divider Line -->
    <line class="divider-line" x1="22" y1="144" x2="418" y2="144" style="stroke: var(--border-1);" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Tech Chips (2 Rows on Mobile) -->
    <g transform="translate(22, 156)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="90" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">⚡ React 18</text>
      </g>

      <g transform="translate(98, 0)">
        <rect x="0" y="0" width="98" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">📘 TypeScript</text>
      </g>

      <g transform="translate(204, 0)">
        <rect x="0" y="0" width="102" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.1s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">☕ Java SE 17</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="96" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse accent-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent);" fill="#EA431B">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">🐍 Python/ML</text>
      </g>

      <g transform="translate(104, 32)">
        <rect x="0" y="0" width="130" height="24" rx="12" class="chip-bg" style="fill: var(--chip-bg); stroke: var(--chip-border);" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle class="dot-pulse purple-fill" cx="10" cy="12" r="2.5" style="fill: var(--accent-purple);" fill="#9333EA">
          <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="16" class="chip-text">🏆 Oracle Certified</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(22, 230)">
      <rect x="0" y="0" width="396" height="26" rx="13" class="accent-soft-bg" style="fill: var(--accent-soft-bg); stroke: var(--accent);" fill="#FFF5F2" stroke="#EA431B" stroke-width="1"/>
      <g transform="translate(12, 6)">
        <path class="accent-fill" d="M5 1a4 4 0 0 0-1.3 7.8c.2.1.3 0 .3-.2v-.7c-1.1.2-1.3-.6-1.3-.6-.2-.4-.4-.6-.4-.6-.3-.2 0-.2 0-.2.4 0 .6.3.6.3.4.6 1 .4 1.2.3 0-.3.2-.4.3-.6-.9-.1-1.8-.4-1.8-2 0-.4.1-.8.4-1.1a1.5 1.5 0 0 1 .1-1.1s.3-.1 1.1.3a3.8 3.8 0 0 1 2 0c.8-.4 1.1-.3 1.1-.3a1.5 1.5 0 0 1 .1 1.1c.3.3.4.7.4 1.1 0 1.6-.9 1.9-1.8 2 .2.2.3.4.3.8v1.2c0 .2.1.3.3.2A4 4 0 0 0 5 1z" style="fill: var(--accent);" fill="#EA431B"/>
      </g>
      <text x="28" y="17" class="data-text">GitHub • ComradeMohan</text>
    </g>

    <g transform="translate(22, 264)">
      <rect x="0" y="0" width="396" height="26" rx="13" class="pill-bg" style="fill: var(--pill-bg); stroke: var(--accent);" fill="#FFF5F2" stroke="#EA431B" stroke-width="1"/>
      <g transform="translate(12, 7)">
        <circle cx="6" cy="6" r="5" fill="none" class="accent-stroke" style="stroke: var(--accent);" stroke="#EA431B" stroke-width="1.2"/>
        <circle cx="6" cy="6" r="2" class="accent-fill" style="fill: var(--accent);" fill="#EA431B"/>
      </g>
      <text x="32" y="17.5" class="data-text">🌐 mohanreddy.me • Open to Opportunities</text>
    </g>
  </g>
</svg>
